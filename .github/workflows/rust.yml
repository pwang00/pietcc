name: Rust

on:
  push:
    branches: [ main, tests, ci ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install LLVM
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev
          echo "/usr/lib/llvm-23/bin" >> $GITHUB_PATH
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> $GITHUB_ENV

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@23
          echo "LLVM_SYS_231_PREFIX=$(brew --prefix llvm@23)" >> $GITHUB_ENV
          echo "$(brew --prefix llvm@23)/bin" >> $GITHUB_PATH

      - name: Install npiet build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y build-essential git libgd-dev libpng-dev libgif-dev

      - name: Install npiet build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gd libpng giflib pkg-config
          echo "CPPFLAGS=-I$(brew --prefix)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix)/lib" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix)/lib" >> $GITHUB_ENV

      - name: Run unit and integration tests
        run: ./scripts/run_tests.sh

  lint:
    name: Linting (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev
          echo "/usr/lib/llvm-23/bin" >> $GITHUB_PATH
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> $GITHUB_ENV

      - name: Run rustfmt
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev
          echo "/usr/lib/llvm-23/bin" >> $GITHUB_PATH
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> $GITHUB_ENV

      - name: Check compilation
        run: cargo check --all-targets

      - name: Build in release mode
        run: cargo build --release

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build patched npiet
        run: |
          sudo apt-get install -y build-essential git libgd-dev libpng-dev libgif-dev
          ./scripts/build_npiet.sh
          echo "$GITHUB_WORKSPACE/target/npiet/bin" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev libpolly-23-dev llvm-23-tools
          echo "/usr/lib/llvm-23/bin" >> $GITHUB_PATH
          echo "LLVM_SYS_231_PREFIX=/usr/lib/llvm-23" >> $GITHUB_ENV

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate coverage
        run: cargo tarpaulin --verbose --all-features --workspace --timeout 300 --out xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
